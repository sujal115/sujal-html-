<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Photo Gallery</title>
    <link href="https://jsdelivr.net" rel="stylesheet">
</head>
<body class="bg-light p-4">

    <div class="container">
        <h1 class="text-center mb-3"> My Photo Gallery</h1>
        <div class="text-center mb-5">
        </div>
        <div class="row g-4 justify-content-center">
            <div class="col-sm-6 col-md-4">
                <div class="bg-white p-2 rounded shadow-sm text-center">
                    <img src="./sunrise.jpg" alt="Photo 1" class="img-fluid rounded mb-2" style="height: 20%; width: 10%; object-fit: cover;">
                    <p class="text-muted m-0 small">Beautiful Sunrise </p>
                </div>
            </div>
            <div class="col-sm-6 col-md-4">
                <div class="bg-white p-2 rounded shadow-sm text-center">
                    <img src="./hiking.jpg" alt="Photo 2" class="img-fluid rounded mb-2" style="height: 20%; width: 10%; object-fit: cover;">
                    <p class="text-muted m-0 small">Weekend Hiking Trip </p>
                </div>
            </div>
            <div class="col-sm-6 col-md-4">
                <div class="bg-white p-2 rounded shadow-sm text-center">
                    <img src="./cofee.jpg" alt="Photo 3" class="img-fluid rounded mb-2" style="height: 20%; width: 10%; object-fit: cover;">
                    <p class="text-muted m-0 small">My Morning Coffee </p>
                </div>
            </div>
            <div class="col-sm-6 col-md-4">
                <div class="bg-white p-2 rounded shadow-sm text-center">
                    <img src="./city night.jpg" alt="Photo 4" class="img-fluid rounded mb-2" style="height: 20%; width: 10%; object-fit: cover;">
                    <p class="text-muted m-0 small">City Skyline at Night </p>
                </div>
            </div>
            <div class="col-sm-6 col-md-4">
                <div class="bg-white p-2 rounded shadow-sm text-center">
                    <img src="./lunch.jpg" alt="Photo 5" class="img-fluid rounded mb-2" style="height: 20%; width: 10%; object-fit: cover;">
                    <p class="text-muted m-0 small">Delicious Lunch </p>
                </div>
            </div>
            <div class="col-sm-6 col-md-4">
                <div class="bg-white p-2 rounded shadow-sm text-center">
                    <img src="./beach.jpg" alt="Photo 6" class="img-fluid rounded mb-2" style="height: 20%; width: 10%; object-fit: cover;">
                    <p class="text-muted m-0 small">Relaxing at the Beach </p>
                </div>
            </div>

        </div>
    </div>

</body>
</html>
