<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>table</title>
</head>
<style>
    table{
        border: 7px solid black;
        padding: 3px;
    }
    td{
        border: 3px solid black;
        padding: 20px;
        background-color: wheat;
    }
</style>
<body>
    <table>
        <tbody>
            <tr>
                <td>name</td>
                <td>age</td>
                <td>gender</td>
                <td>course</td>
                <td>class</td>
            </tr>
            <tr>
                <td>sujal</td>
                <td>22</td>
                <td>male</td>
                <td>cse</td>
                <td>4th year</td>
            </tr>
            <tr>
                <td>abhi</td>
                <td>22</td>
                <td>male</td>
                <td>cse</td>
                <td>4th year</td>
            </tr>
        </tbody>
    </table>
    
</body>
</html>
